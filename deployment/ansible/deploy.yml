---
# Episciences Front-Next — Ansistrano deployment playbook
#
# Usage:
#   ansible-playbook deploy.yml -i inventory/preprod.ini
#   ansible-playbook deploy.yml -i inventory/production.ini
#
# Prerequisites:
#   ansible-galaxy install -r requirements.yml
#   ansible-galaxy collection install community.general

# Strategy: two-play deployment for zero-downtime rolling restarts
#   Play 1 (parallel): git clone + build on all servers simultaneously
#   Play 2 (serial: 1): restart one server at a time — load balancer always has live servers

- name: Deploy Episciences Front-Next (parallel build)
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Clear stale git remote refs in ansistrano repo cache
      ansible.builtin.shell: |
        find refs/remotes -type f -delete 2>/dev/null || true
        rm -f packed-refs.lock .git/index.lock
        git pack-refs --all
      args:
        chdir: '{{ ansistrano_deploy_to }}/repo'
      failed_when: false
      changed_when: false

  roles:
    - ansistrano.deploy

- name: Rolling restart (one server at a time)
  hosts: all
  gather_facts: false
  serial: 1

  tasks:
    - name: Reload systemd daemon
      ansible.builtin.command:
        cmd: sudo /bin/systemctl daemon-reload
      changed_when: true

    - name: Restart episciences-next service
      ansible.builtin.command:
        cmd: sudo /bin/systemctl restart episciences-front-next
      changed_when: true

    - name: Wait for service to be healthy
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3000
        delay: 3
        timeout: 30

# The PDF cache worker (scripts/pdf-cache-worker.service) runs on a single
# host per environment and is not restarted with the app above: without this
# play it would keep running the previous release's code and .env.local.
# A separate play, after every app restart, so that a failure here (e.g. a
# missing sudoers rule, see SETUP.md) never interrupts the app rollout.
- name: Restart the PDF cache worker where it is installed
  hosts: all
  gather_facts: false

  tasks:
    - name: Check whether the PDF cache worker unit is installed
      ansible.builtin.command:
        cmd: /bin/systemctl list-unit-files episciences-pdf-cache-worker.service --no-legend
      register: pdf_cache_worker_unit
      changed_when: false
      failed_when: false

    # try-restart only restarts the unit if it is running: a stopped worker
    # (cache not rolled out yet, or deliberately stopped) stays stopped.
    - name: Restart the PDF cache worker if it is running
      ansible.builtin.command:
        cmd: sudo /bin/systemctl try-restart episciences-pdf-cache-worker
      when: pdf_cache_worker_unit.stdout | trim | length > 0
      changed_when: true
