name: CI Tests

# Trigger on pushes to long-lived branches and on PRs targeting them.
# Feature branches are tested through their PR only, to avoid running
# the same commit twice (push + pull_request).
on:
  push:
    branches:
      - main
      - preprod
  pull_request:
    branches:
      - main
      - preprod

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      NODE_ENV: 'development'

    # Test against supported Node.js versions (vitest 3.x requires Node >= 19)
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Setup Node.js with caching for faster builds
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Install dependencies using npm ci for clean install
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Run ESLint to check code quality
      - name: Run linter
        run: npm run lint -- --quiet

      # Type-check the whole project: Vitest runs tests without checking types
      - name: Run type check
        run: npm run typecheck

      # Run tests once with coverage (fails on test failure or threshold breach)
      - name: Run tests with coverage
        run: npm run test:coverage

      # Upload coverage artifacts for later inspection
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7
