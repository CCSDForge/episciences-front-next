# SonarQube Project Configuration
# https://docs.sonarsource.com/sonarqube-community-build/project-administration/narrowing-the-focus/

# Server URL
sonar.host.url=http://localhost:9000

# Metadata
sonar.projectKey=episciences-front-next
sonar.projectName=Episciences Front Next
sonar.projectVersion=0.1.0

# Encoding
sonar.sourceEncoding=UTF-8

# Paths to source and test directories
sonar.sources=src
sonar.tests=src

# Inclusions & Exclusions for Sources
sonar.exclusions=src/**/__tests__/**, src/**/*.test.ts, src/**/*.test.tsx, src/**/*.spec.ts, src/**/*.spec.tsx, src/test-utils/**, node_modules/**, .next/**, coverage/**, dist/**, tmp/**, public/**, **/*.config.{js,ts}

# Inclusions & Exclusions for Tests
sonar.test.inclusions=src/**/__tests__/**, src/**/*.test.ts, src/**/*.test.tsx, src/**/*.spec.ts, src/**/*.spec.tsx

# Path to Vitest coverage report
sonar.javascript.lcov.reportPaths=coverage/lcov.info
